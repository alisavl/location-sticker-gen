<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location Sticker</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --separator: rgba(0,0,0,0.08);
    --field: rgba(118,118,128,0.12);
    --seg-active: #ffffff;
    --accent: #0071e3;
    --stage: #000000;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 28px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --secondary: #98989d;
      --separator: rgba(255,255,255,0.1);
      --field: rgba(118,118,128,0.24);
      --seg-active: #636366;
      --accent: #2997ff;
      --stage: #000000;
      --shadow: 0 0 0 1px rgba(255,255,255,0.06);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f5f5f7;
    --secondary: #98989d;
    --separator: rgba(255,255,255,0.1);
    --field: rgba(118,118,128,0.24);
    --seg-active: #636366;
    --accent: #2997ff;
    --stage: #000000;
    --shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em;
    margin: 0 0 6px;
  }
  .sub { color: var(--secondary); margin: 0 0 32px; }

  .stage {
    position: relative;
    background: var(--stage);
    border-radius: 22px;
    height: 240px;
    display: grid;
    place-items: center;
    padding: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .stage.checker {
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #ddd 25%, transparent 25%),
      linear-gradient(-45deg, #ddd 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ddd 75%),
      linear-gradient(-45deg, transparent 75%, #ddd 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  .stage.photo { background: linear-gradient(135deg, #f6a96b 0%, #d9677e 45%, #5b4f9e 100%); }
  #sticker { display: block; max-width: 100%; height: auto; }

  .stage-tools {
    position: absolute; top: 12px; right: 12px;
    display: flex; gap: 8px;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.16);
    color: #fff;
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    transition: background .2s, transform .1s;
  }
  .stage.checker .icon-btn { background: rgba(0,0,0,0.55); }
  .icon-btn:hover { background: rgba(255,255,255,0.26); }
  .stage.checker .icon-btn:hover { background: rgba(0,0,0,0.7); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .icon-btn svg { width: 18px; height: 18px; }

  .bg-switch {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px;
  }
  .swatch {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5);
    cursor: pointer; padding: 0;
  }
  .swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.3); }
  .swatch.s-dark { background: #000; }
  .swatch.s-photo { background: linear-gradient(135deg, #f6a96b, #d9677e, #5b4f9e); }
  .swatch.s-checker { background: conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0/8px 8px; }

  .group {
    margin-top: 28px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 16px; min-height: 52px;
  }
  .row + .row { border-top: 1px solid var(--separator); }
  .row label { font-weight: 400; white-space: nowrap; }
  .group-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em;
    color: var(--secondary); margin: 28px 16px 8px;
  }
  .group-title + .group { margin-top: 0; }

  input[type="text"] {
    flex: 1; min-width: 0;
    font: inherit; color: var(--text); letter-spacing: inherit;
    background: transparent; border: 0; outline: none;
    text-align: right;
  }
  input[type="text"]::placeholder { color: var(--secondary); }

  .segmented {
    display: inline-flex; padding: 2px; border-radius: 9px;
    background: var(--field);
  }
  .segmented button {
    font: 500 13px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    letter-spacing: -0.01em;
    color: var(--text);
    border: 0; background: transparent; cursor: pointer;
    padding: 7px 14px; border-radius: 7px;
    transition: background .2s, box-shadow .2s;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--seg-active);
    box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
  }
  .segmented button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .meta { color: var(--secondary); font-size: 13px; margin: 8px 16px 0; }

  .toast {
    position: fixed; left: 50%; bottom: 32px;
    transform: translate(-50%, 20px); opacity: 0;
    background: rgba(40,40,40,0.85); color: #fff;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    padding: 10px 18px; border-radius: 999px; font-size: 15px;
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    body { padding: 32px 16px; }
    h1 { font-size: 32px; }
    .stage { height: 200px; }
    .segmented button { padding: 7px 10px; }
  }
</style>
</head>
<body>
<main>
  <h1>Location Sticker</h1>
  <p class="sub">Type a place, pick the case, then copy or download.</p>

  <div class="stage" id="stage">
    <canvas id="sticker" aria-label="Location sticker preview"></canvas>
    <div class="stage-tools">
      <button class="icon-btn" id="copyBtn" title="Copy to clipboard" aria-label="Copy to clipboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
      </button>
      <button class="icon-btn" id="downloadBtn" title="Download PNG" aria-label="Download PNG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10.5 5 5 5-5"/><path d="M5 19.5h14"/></svg>
      </button>
    </div>
    <div class="bg-switch" role="group" aria-label="Preview background">
      <button class="swatch s-dark" data-bg="" aria-pressed="true" title="Black"></button>
      <button class="swatch s-photo" data-bg="photo" aria-pressed="false" title="Colour"></button>
      <button class="swatch s-checker" data-bg="checker" aria-pressed="false" title="Transparent"></button>
    </div>
  </div>

  <div class="group-title">Sticker</div>
  <div class="group">
    <div class="row">
      <label for="location">Location</label>
      <input type="text" id="location" value="Stuttgart, Germany" placeholder="Enter a place" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <label>Case</label>
      <div class="segmented" role="group" aria-label="Letter case" id="caseSeg">
        <button data-case="none" aria-pressed="true">As typed</button>
        <button data-case="upper" aria-pressed="false">UPPER</button>
        <button data-case="lower" aria-pressed="false">lower</button>
      </div>
    </div>
  </div>
  <p class="meta" id="meta">PNG with transparent background</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // Geometry measured from the reference sticker, as fractions of sticker height H.
  const H = 120;                 // logical sticker height
  const SCALE = 3;               // export / preview resolution multiplier
  const G = {
    radius:   0.24,  // corner radius
    padLeft:  0.325, // left edge -> icon
    iconH:    0.50,  // pin height
    gap:      0.22,  // icon -> text
    fontSize: 0.555, // ~0.39H cap height
    padRight: 0.33,  // text -> right edge
    fill: 'rgba(255,255,255,0.2)' // translucent "glass" over the photo
  };
  const FONT = '"SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif';
  const WEIGHT = 500;

  // Map pin traced from the reference (units = reference pixels at H≈117):
  // round head, tangent sides easing into a rounded tip, solid centre dot.
  const PIN = { cx: 32, cy: 31, r: 20.5, tipY: 61.5, stroke: 6.8, dotR: 5.5, bulge: 1.5 };
  const PIN_BOX = {
    x: PIN.cx - PIN.r - PIN.stroke / 2,
    y: PIN.cy - PIN.r - PIN.stroke / 2,
    w: 2 * PIN.r + PIN.stroke,
    h: PIN.tipY + 3.4 - (PIN.cy - PIN.r - PIN.stroke / 2)
  };
  function drawPin(c) {
    const { cx, cy, r, tipY, bulge } = PIN;
    const th = Math.acos(r / (tipY - cy));
    const a1 = Math.PI / 2 - th, a2 = Math.PI / 2 + th;
    const lx = cx + r * Math.cos(a2), rx = cx + r * Math.cos(a1);
    const ly = cy + r * Math.sin(a2), my = ly + (tipY - ly) / 2 + bulge * 0.2;
    c.beginPath();
    c.moveTo(cx, tipY);
    c.quadraticCurveTo(lx + (cx - lx) / 2 - bulge, my, lx, ly);
    c.arc(cx, cy, r, a2, a1 + Math.PI * 2);
    c.quadraticCurveTo(rx - (rx - cx) / 2 + bulge, my, cx, tipY);
    c.closePath();
    c.lineWidth = PIN.stroke;
    c.lineJoin = 'round';
    c.stroke();
    c.beginPath();
    c.arc(cx, cy, PIN.dotR, 0, Math.PI * 2);
    c.fill();
  }

  const canvas = document.getElementById('sticker');
  const ctx = canvas.getContext('2d');
  const input = document.getElementById('location');
  const meta = document.getElementById('meta');
  let caseMode = 'none';

  const fontStr = (s) => `${WEIGHT} ${G.fontSize * H * s}px ${FONT}`;

  function displayText() {
    const t = input.value.trim() || 'Location';
    if (caseMode === 'upper') return t.toLocaleUpperCase();
    if (caseMode === 'lower') return t.toLocaleLowerCase();
    return t;
  }

  function render() {
    const s = SCALE;
    const text = displayText();
    ctx.font = fontStr(s);
    const m = ctx.measureText(text);
    const textW = m.width;

    const iconH = G.iconH * H * s;
    const iconScale = iconH / PIN_BOX.h;
    const iconW = PIN_BOX.w * iconScale;

    const h = Math.round(H * s);
    const w = Math.ceil(G.padLeft * H * s + iconW + G.gap * H * s + textW + G.padRight * H * s);

    canvas.width = w;
    canvas.height = h;
    canvas.style.width = (w / s) + 'px';

    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = G.fill;
    ctx.beginPath();
    ctx.roundRect(0, 0, w, h, G.radius * H * s);
    ctx.fill();

    // Pin icon, vertically centred
    const ix = G.padLeft * H * s;
    const iy = (h - iconH) / 2;
    ctx.save();
    ctx.translate(ix - PIN_BOX.x * iconScale, iy - PIN_BOX.y * iconScale);
    ctx.scale(iconScale, iconScale);
    ctx.strokeStyle = '#fff';
    ctx.fillStyle = '#fff';
    drawPin(ctx);
    ctx.restore();

    // Text: centre the cap height on the sticker's midline
    ctx.font = fontStr(s);
    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'alphabetic';
    const capM = ctx.measureText('H');
    const capH = capM.actualBoundingBoxAscent;
    const tx = ix + iconW + G.gap * H * s;
    const ty = h / 2 + capH / 2;
    ctx.fillText(text, tx, ty);

    meta.textContent = `PNG · ${w} × ${h} px · transparent background`;
  }

  function toBlob() {
    return new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('Export failed')), 'image/png'));
  }

  function fileName() {
    const slug = displayText().toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'location';
    return `location-sticker-${slug}.png`;
  }

  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      // Passing a promise keeps Safari's user-gesture requirement happy.
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': toBlob() })]);
      toast('Copied to clipboard');
    } catch (e) {
      console.error(e);
      toast('Copy not supported here — try Download');
    }
  });

  // In the claude.ai viewer, saves go through the downloads capability.
  let downloadsApi = null;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(d => { downloadsApi = d; }).catch(() => {});
  }

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    const blob = await toBlob();
    if (downloadsApi) {
      try {
        await downloadsApi.save({ filename: fileName(), data: blob });
        toast('PNG saved');
      } catch (e) {
        if (e && e.code !== 'declined') toast('Download unavailable here');
      }
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('PNG downloaded');
  });

  document.getElementById('caseSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    caseMode = b.dataset.case;
    for (const btn of e.currentTarget.children) btn.setAttribute('aria-pressed', btn === b);
    render();
  });

  const stage = document.getElementById('stage');
  document.querySelector('.bg-switch').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    stage.classList.remove('photo', 'checker');
    if (b.dataset.bg) stage.classList.add(b.dataset.bg);
    for (const btn of e.currentTarget.children) btn.setAttribute('aria-pressed', btn === b);
  });

  input.addEventListener('input', render);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(render);
  render();
})();
</script>
</body>
</html>
